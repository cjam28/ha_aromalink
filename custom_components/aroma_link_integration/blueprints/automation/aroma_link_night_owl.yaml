blueprint:
  name: "Aroma-Link: Night Owl (After-Hours Presence)"
  description: >
    Enables the Night Owl program (P5) when room presence is detected outside
    of scheduled hours, HVAC is running, and the user has Night Owl enabled.
    The Night Owl switch is a user preference — the automation controls P5
    on the device via a service call without toggling the switch.

    Also triggers after a dashboard schedule sync so the automation can
    immediately enforce HVAC/occupancy logic on any newly-enabled program.

    All Aroma-Link entities (Night Owl, Scheduled On) are automatically
    resolved from the selected device.
  domain: automation
  author: cjam28
  source_url: https://raw.githubusercontent.com/cjam28/homeassistant_aroma-link/master/custom_components/aroma_link_integration/blueprints/automation/aroma_link_night_owl.yaml
  input:
    aroma_device:
      name: Aroma-Link Device
      description: >
        Select your Aroma-Link diffuser device. All Aroma-Link entities
        (Night Owl, Scheduled On) are automatically resolved from this device.
      selector:
        device:
          integration: aroma_link_integration
    hvac_entity:
      name: HVAC / Thermostat
      description: The climate entity to monitor.
      selector:
        entity:
          domain: climate
    presence_sensors:
      name: Presence Sensors
      description: >
        Room presence or occupancy sensors that detect someone is awake
        after hours. Select one or more.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    hvac_on_delay:
      name: HVAC On Delay
      description: Minutes to wait after the HVAC starts before enabling the diffuser.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: minutes
    presence_off_delay:
      name: Presence Off Delay
      description: Minutes to wait after all presence sensors clear before disabling Night Owl.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

mode: restart

triggers:
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    from: "idle"
    for:
      minutes: !input hvac_on_delay
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    to: "idle"
  - trigger: state
    entity_id: !input presence_sensors
    to: "on"
  - trigger: state
    entity_id: !input presence_sensors
    to: "off"
    for:
      minutes: !input presence_off_delay
  - trigger: event
    event_type: aroma_link_integration_schedule_synced

actions:
  - variables:
      aroma_device: !input aroma_device
      hvac_entity: !input hvac_entity
      presence_sensors: !input presence_sensors
      night_owl_switch: >-
        {{ device_entities(aroma_device) | select('match', 'switch\\..*_night_owl$') | first }}
      scheduled_on_sensor: >-
        {{ device_entities(aroma_device) | select('match', 'binary_sensor\\..*_scheduled_on$') | first }}
  - action: homeassistant.update_entity
    target:
      entity_id: "{{ hvac_entity }}"
  - delay:
      seconds: 5
  - variables:
      want_night_owl: >-
        {{ state_attr(hvac_entity, 'hvac_action') not in ['idle', none, 'off']
           and is_state(scheduled_on_sensor, 'off')
           and is_state(night_owl_switch, 'on')
           and expand(presence_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      device_id: >-
        {{ state_attr(night_owl_switch, 'device_id') }}
  - if:
      - condition: template
        value_template: "{{ want_night_owl }}"
    then:
      - action: aroma_link_integration.set_night_owl_active
        data:
          device_id: "{{ device_id }}"
          enabled: true
    else:
      - action: aroma_link_integration.set_night_owl_active
        data:
          device_id: "{{ device_id }}"
          enabled: false
