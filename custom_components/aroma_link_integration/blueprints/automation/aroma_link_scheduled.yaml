blueprint:
  name: "Aroma-Link: Scheduled Diffuser with HVAC"
  description: >
    Enables the diffuser schedule (P1-P4) only when HVAC is actively
    heating/cooling during scheduled hours and someone is home. Uses an
    evaluate-and-set pattern — every trigger re-checks the current state.

    All Aroma-Link entities (Schedule Active, Scheduled On) are
    automatically resolved from the selected device.
  domain: automation
  author: cjam28
  source_url: https://raw.githubusercontent.com/cjam28/homeassistant_aroma-link/master/custom_components/aroma_link_integration/blueprints/automation/aroma_link_scheduled.yaml
  input:
    aroma_device:
      name: Aroma-Link Device
      description: >
        Select your Aroma-Link diffuser device. All Aroma-Link entities
        (Schedule Active, Scheduled On) are automatically resolved from
        this device.
      selector:
        device:
          integration: aroma_link_integration
    hvac_entity:
      name: HVAC / Thermostat
      description: The climate entity to monitor.
      selector:
        entity:
          domain: climate
    occupancy_sensor:
      name: Occupancy Sensor
      description: Binary sensor that indicates someone is home.
      selector:
        entity:
          domain: binary_sensor
    hvac_on_delay:
      name: HVAC On Delay
      description: Minutes to wait after the HVAC starts before enabling the diffuser.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: minutes

mode: restart

trigger_variables:
  _aroma_device: !input aroma_device
  _scheduled_on_sensor: >-
    {{ device_entities(_aroma_device) | select('match', 'binary_sensor\\..*_scheduled_on$') | first }}

triggers:
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    from: "idle"
    for:
      minutes: !input hvac_on_delay
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    to: "idle"
  - trigger: state
    entity_id: "{{ _scheduled_on_sensor }}"

actions:
  - variables:
      aroma_device: !input aroma_device
      hvac_entity: !input hvac_entity
      occupancy_sensor: !input occupancy_sensor
      schedule_active_switch: >-
        {{ device_entities(aroma_device) | select('match', 'switch\\..*_schedule_active$') | first }}
      scheduled_on_sensor: >-
        {{ device_entities(aroma_device) | select('match', 'binary_sensor\\..*_scheduled_on$') | first }}
  - variables:
      want_schedule: >-
        {{ state_attr(hvac_entity, 'hvac_action') not in ['idle', none, 'off']
           and is_state(scheduled_on_sensor, 'on')
           and is_state(occupancy_sensor, 'on') }}
  - if:
      - condition: template
        value_template: "{{ want_schedule }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ schedule_active_switch }}"
    else:
      - action: switch.turn_off
        target:
          entity_id: "{{ schedule_active_switch }}"
