blueprint:
  name: "Aroma-Link: Scheduled Diffuser with HVAC"
  description: >
    Enables the diffuser schedule (P1-P4) only when HVAC is actively
    heating/cooling during scheduled hours and someone is home. Uses an
    evaluate-and-set pattern — every trigger re-checks the current state.
  domain: automation
  author: cjam28
  source_url: https://raw.githubusercontent.com/cjam28/homeassistant_aroma-link/master/custom_components/aroma_link_integration/blueprints/automation/aroma_link_scheduled.yaml
  input:
    hvac_entity:
      name: HVAC / Thermostat
      description: The climate entity to monitor.
      selector:
        entity:
          domain: climate
    occupancy_sensor:
      name: Occupancy Sensor
      description: Binary sensor that indicates someone is home.
      selector:
        entity:
          domain: binary_sensor
    scheduled_on_sensor:
      name: Scheduled On Sensor
      description: "The Aroma-Link 'Scheduled On' binary sensor (binary_sensor.*_scheduled_on)."
      selector:
        entity:
          domain: binary_sensor
    schedule_active_switch:
      name: Schedule Active Switch
      description: "The Aroma-Link 'Schedule Active' switch (switch.*_schedule_active)."
      selector:
        entity:
          domain: switch
    hvac_on_delay:
      name: HVAC On Delay
      description: Minutes to wait after the HVAC starts before enabling the diffuser.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: minutes

mode: restart

triggers:
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    from: "idle"
    for:
      minutes: !input hvac_on_delay
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    to: "idle"
  - trigger: state
    entity_id: !input scheduled_on_sensor

actions:
  - variables:
      hvac_entity: !input hvac_entity
      scheduled_on_sensor: !input scheduled_on_sensor
      occupancy_sensor: !input occupancy_sensor
  - variables:
      want_schedule: >-
        {{ state_attr(hvac_entity, 'hvac_action') not in ['idle', none, 'off']
           and is_state(scheduled_on_sensor, 'on')
           and is_state(occupancy_sensor, 'on') }}
  - if:
      - condition: template
        value_template: "{{ want_schedule }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: !input schedule_active_switch
    else:
      - action: switch.turn_off
        target:
          entity_id: !input schedule_active_switch
