blueprint:
  name: "Aroma-Link: Scheduled Diffuser with HVAC"
  description: >
    Automatically enables/disables the diffuser schedule (P1-P4) when your
    HVAC system starts or stops heating/cooling. Only runs during scheduled
    hours and when someone is home. Also reacts to schedule window boundaries
    — disables P1-P4 when the window closes and enables them when it opens
    (if HVAC is already active). Triggers on hvac_action (idle → heating/cooling).
  domain: automation
  author: cjam28
  source_url: https://raw.githubusercontent.com/cjam28/homeassistant_aroma-link/master/custom_components/aroma_link_integration/blueprints/automation/aroma_link_scheduled.yaml
  input:
    hvac_entity:
      name: HVAC / Thermostat
      description: >
        The climate entity to monitor. Triggers when hvac_action changes
        from idle to heating/cooling (and back). Works with ecobee, Nest,
        and other standard climate entities.
      selector:
        entity:
          domain: climate
    occupancy_sensor:
      name: Occupancy Sensor
      description: Binary sensor that indicates someone is home (e.g. an aggregate of room sensors).
      selector:
        entity:
          domain: binary_sensor
    scheduled_on_sensor:
      name: Scheduled On Sensor
      description: "The Aroma-Link 'Scheduled On' binary sensor (binary_sensor.*_scheduled_on)."
      selector:
        entity:
          domain: binary_sensor
    schedule_active_switch:
      name: Schedule Active Switch
      description: "The Aroma-Link 'Schedule Active' switch (switch.*_schedule_active)."
      selector:
        entity:
          domain: switch
    hvac_on_delay:
      name: HVAC On Delay
      description: Minutes to wait after the HVAC starts running before enabling the diffuser.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: minutes

mode: single

triggers:
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    from: "idle"
    for:
      minutes: !input hvac_on_delay
    id: hvac_on
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    to: "idle"
    id: hvac_off
  - trigger: state
    entity_id: !input scheduled_on_sensor
    to: "on"
    id: schedule_window_open
  - trigger: state
    entity_id: !input scheduled_on_sensor
    to: "off"
    id: schedule_window_close

actions:
  - choose:
      # HVAC starts running during schedule → enable P1-P4
      - conditions:
          - condition: trigger
            id: hvac_on
          - condition: state
            entity_id: !input occupancy_sensor
            state: "on"
          - condition: state
            entity_id: !input scheduled_on_sensor
            state: "on"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input schedule_active_switch

      # HVAC goes idle during schedule → disable P1-P4
      - conditions:
          - condition: trigger
            id: hvac_off
          - condition: state
            entity_id: !input scheduled_on_sensor
            state: "on"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input schedule_active_switch

      # Schedule window opens + HVAC already active + occupied → enable P1-P4
      - conditions:
          - condition: trigger
            id: schedule_window_open
          - condition: state
            entity_id: !input occupancy_sensor
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: !input hvac_entity
                attribute: hvac_action
                state: "idle"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: !input schedule_active_switch

      # Schedule window closes → disable P1-P4 (cleanup)
      - conditions:
          - condition: trigger
            id: schedule_window_close
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input schedule_active_switch
