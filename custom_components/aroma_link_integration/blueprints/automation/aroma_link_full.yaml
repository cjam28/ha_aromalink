blueprint:
  name: "Aroma-Link: Full Diffuser Control (Schedule + Night Owl)"
  description: >
    Complete diffuser automation using an evaluate-and-set pattern. Every
    trigger re-evaluates the current state and sets outputs accordingly:

      Schedule active = HVAC running + in scheduled window + home occupied
      Night Owl (P5)  = HVAC running + outside schedule + room presence
                        + user has Night Owl preference enabled

    The Night Owl switch is a user preference — flip it ON to allow
    after-hours diffusing, OFF to disable it entirely. The automation
    controls P5 on the device via a service call, not by toggling
    the switch itself.

    All Aroma-Link entities (Schedule Active, Night Owl, Scheduled On)
    are automatically resolved from the selected device.
  domain: automation
  author: cjam28
  source_url: https://raw.githubusercontent.com/cjam28/homeassistant_aroma-link/master/custom_components/aroma_link_integration/blueprints/automation/aroma_link_full.yaml
  input:
    aroma_device:
      name: Aroma-Link Device
      description: >
        Select your Aroma-Link diffuser device. All Aroma-Link entities
        (Schedule Active, Night Owl, Scheduled On) are automatically
        resolved from this device.
      selector:
        device:
          integration: aroma_link_integration
    hvac_entity:
      name: HVAC / Thermostat
      description: >
        The climate entity to monitor. Triggers when hvac_action changes
        between idle and heating/cooling.
      selector:
        entity:
          domain: climate
    occupancy_sensor:
      name: Home Occupancy Sensor
      description: Binary sensor that indicates someone is home (used during scheduled hours).
      selector:
        entity:
          domain: binary_sensor
    presence_sensors:
      name: Room Presence Sensors (After-Hours)
      description: >
        Specific room sensors that detect someone is awake after hours
        (e.g. living room, kitchen). Select one or more.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    hvac_on_delay:
      name: HVAC On Delay
      description: Minutes to wait after the HVAC starts before enabling the diffuser.
      default: 1
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: minutes
    presence_off_delay:
      name: Presence Off Delay
      description: Minutes to wait after all presence sensors clear before disabling Night Owl.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

mode: restart

trigger_variables:
  _aroma_device: !input aroma_device
  _scheduled_on_sensor: >-
    {{ device_entities(_aroma_device) | select('match', 'binary_sensor\\..*_scheduled_on$') | first }}

triggers:
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    from: "idle"
    for:
      minutes: !input hvac_on_delay
  - trigger: state
    entity_id: !input hvac_entity
    attribute: hvac_action
    to: "idle"
  - trigger: template
    value_template: "{{ is_state(_scheduled_on_sensor, 'on') }}"
  - trigger: template
    value_template: "{{ is_state(_scheduled_on_sensor, 'off') }}"
  - trigger: state
    entity_id: !input presence_sensors
    to: "on"
  - trigger: state
    entity_id: !input presence_sensors
    to: "off"
    for:
      minutes: !input presence_off_delay

actions:
  - variables:
      aroma_device: !input aroma_device
      hvac_entity: !input hvac_entity
      occupancy_sensor: !input occupancy_sensor
      presence_sensors: !input presence_sensors
      schedule_active_switch: >-
        {{ device_entities(aroma_device) | select('match', 'switch\\..*_schedule_active$') | first }}
      night_owl_switch: >-
        {{ device_entities(aroma_device) | select('match', 'switch\\..*_night_owl$') | first }}
      scheduled_on_sensor: >-
        {{ device_entities(aroma_device) | select('match', 'binary_sensor\\..*_scheduled_on$') | first }}
  - variables:
      hvac_running: >-
        {{ state_attr(hvac_entity, 'hvac_action') not in ['idle', none, 'off'] }}
      scheduled: >-
        {{ is_state(scheduled_on_sensor, 'on') }}
      occupied: >-
        {{ is_state(occupancy_sensor, 'on') }}
      presence: >-
        {{ expand(presence_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      night_owl_enabled: >-
        {{ is_state(night_owl_switch, 'on') }}
      device_id: >-
        {{ state_attr(night_owl_switch, 'device_id') }}
  - variables:
      want_schedule: "{{ hvac_running and scheduled and occupied }}"
      want_night_owl: "{{ hvac_running and (not scheduled) and presence and night_owl_enabled }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ want_schedule }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ schedule_active_switch }}"
          - action: aroma_link_integration.set_night_owl_active
            data:
              device_id: "{{ device_id }}"
              enabled: false
      - conditions:
          - condition: template
            value_template: "{{ want_night_owl }}"
        sequence:
          - action: aroma_link_integration.set_night_owl_active
            data:
              device_id: "{{ device_id }}"
              enabled: true
          - action: switch.turn_off
            target:
              entity_id: "{{ schedule_active_switch }}"
    default:
      - action: switch.turn_off
        target:
          entity_id: "{{ schedule_active_switch }}"
      - action: aroma_link_integration.set_night_owl_active
        data:
          device_id: "{{ device_id }}"
          enabled: false
