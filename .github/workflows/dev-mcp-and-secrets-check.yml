name: dev-mcp-and-secrets-check

# Surface-agnostic CI backstop, seeded copy-if-absent into every internal repo.
#  - mcp-drift (always): the server-side backstop the local 10-mcp-regen pre-commit guard cannot
#    provide for web/cloud/guard-less edits — regenerates root .mcp.json from .cursor/mcp.json with
#    a VENDORED, self-contained transform (no dependency on ~/Dev) and FAILS ON DRIFT.
#  - secret-delivery (push only, if .env.op present): proves every op:// ref resolves via the sa-ci
#    Service Account. Never runs for fork PRs, so OP_SERVICE_ACCOUNT_TOKEN is never exposed to
#    untrusted forks; values are written to a temp file and discarded, never printed.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  mcp-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate root .mcp.json and fail on drift
        run: |
          set -euo pipefail
          if [ ! -f .cursor/mcp.json ]; then
            echo "no .cursor/mcp.json (client-portable or no MCP) — nothing to mirror"; exit 0
          fi
          # Vendored transform — byte-identical to lib.sh transform_cursor_to_claude:
          #   Cursor ${env:VAR}  ->  Claude Code ${VAR:-}
          sed -E 's/\$\{env:([A-Za-z_][A-Za-z0-9_]*)\}/${\1:-}/g' .cursor/mcp.json > "${RUNNER_TEMP}/expected.mcp.json"
          if [ ! -f .mcp.json ]; then
            echo "::error file=.mcp.json::root .mcp.json is MISSING (run harmonize-mcp.sh)"; exit 1
          fi
          if ! diff -u .mcp.json "${RUNNER_TEMP}/expected.mcp.json"; then
            echo "::error file=.mcp.json::root .mcp.json is STALE vs .cursor/mcp.json (regenerate with gen-claude-mcp.sh / harmonize-mcp.sh)"; exit 1
          fi
          echo "MCP pair in sync."

  secret-delivery:
    runs-on: ubuntu-latest
    # push only (never fork PRs). hashFiles() cannot be used in a job-level if
    # (it needs a runner; the server rejects the whole workflow file), so the
    # .env.op existence check lives in the run step below.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1
      - name: Resolve op:// refs (masked; values discarded, never printed)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f .env.op ]; then
            echo "no .env.op reference manifest — skipping delivery check"; exit 0
          fi
          if ! grep -qE '^[A-Za-z_][A-Za-z0-9_]*=op://' .env.op; then
            echo "no op:// refs in .env.op — nothing to verify"; exit 0
          fi
          if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
            echo "no OP_SERVICE_ACCOUNT_TOKEN (sa-ci) configured — skipping delivery check"; exit 0
          fi
          out="${RUNNER_TEMP}/resolved.env"
          # op's stderr names the failing ref/auth problem; refs are committed
          # metadata and resolved values only go to $out (discarded), so
          # surfacing stderr leaks nothing.
          if op inject -i .env.op -o "$out"; then
            echo "all op:// refs resolved ($(grep -c '=' "$out" 2>/dev/null || echo 0) vars)"
          else
            echo "::error file=.env.op::op inject failed (see stderr above: bad ref, item/field rename, or sa-ci scope/token)"; exit 1
          fi
          rm -f "$out"
